name: App Builder Deploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "api-mesh-stage", "api-mesh-prod" ]
  # pull_request:
  #   branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  app-builder-deploy:
    name: Deploy App Builder to ${{ github.ref_name }} workspace
    runs-on: ${{ matrix.os }}
    environment: ${{ github.ref_name }}
    strategy:
      max-parallel: 1
      matrix:
        node-version: ['22']
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ${{ matrix.os }}
          version: 11.x.x
      - name: Authenticate with Adobe IMS
        uses: adobe/aio-apps-action@4.0.0
        with:
          os: ${{ matrix.os }}
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENT_ID }}
          CLIENTSECRET: ${{ secrets.CLIENT_SECRET }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICAL_ACCOUNT_ID }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICAL_ACCOUNT_EMAIL }}
          IMSORGID: ${{ secrets.IMSORGID }}
          SCOPES: AdobeID, openid, read_organizations, additional_info.projectedProductContext, additional_info.roles, adobeio_api, read_client_secret, manage_client_secrets
      - name: Select Adobe workspace
        env:
          ORG_ID: ${{ vars.ORGID }}
          PROJECT_ID: ${{ vars.PROJECTID }}
          WORKSPACE_ID: ${{ vars.WORKSPACEID }}
        run: |
          aio console:org:select "$ORG_ID"
          aio console:project:select "$PROJECT_ID"
          aio console:workspace:select "$WORKSPACE_ID"
      - name: Deploy App Builder action (get-purchasing-status)
        env:
          COMMERCE_BASE_URL: ${{ vars.COMMERCE_BASE_URL }}
          COMMERCE_STORE_CODE: ${{ vars.COMMERCE_STORE_CODE }}
          COMMERCE_AUTH_TOKEN: ${{ secrets.COMMERCE_AUTH_TOKEN }}
          AIO_RUNTIME_NAMESPACE: ${{ vars.AIO_RUNTIME_NAMESPACE }}
          AIO_RUNTIME_APIHOST: ${{ vars.AIO_RUNTIME_APIHOST }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
        run: |
          echo "COMMERCE_BASE_URL=$COMMERCE_BASE_URL" >> .env
          echo "COMMERCE_STORE_CODE=$COMMERCE_STORE_CODE" >> .env
          echo "COMMERCE_AUTH_TOKEN=$COMMERCE_AUTH_TOKEN" >> .env
          npm install
          aio app deploy
